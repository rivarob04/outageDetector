name: Request a service
description: Ask for a service to be added to the catalog
title: "Catalog: <service name>"
labels: [catalog]
body:
  - type: input
    id: name
    attributes:
      label: Service name
    validations:
      required: true
  - type: input
    id: status_page
    attributes:
      label: Official status page URL
      description: The page the provider uses to post incidents, e.g. https://www.githubstatus.com
    validations:
      required: true
  - type: input
    id: check_url
    attributes:
      label: A URL that should respond when the service is up
      description: The homepage, a login page or an API endpoint.
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Regions, components that matter, upstream dependencies (with a source).
