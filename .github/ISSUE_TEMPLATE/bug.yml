name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Pulse version
      description: Shown in the footer, or run `pulse version`.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, URLs with credentials and IP addresses first.
      render: text
