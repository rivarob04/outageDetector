[project]
name = "pulse-outage"
version = "0.1.0"
description = "Self-hosted outage map and down detector"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "alembic>=1.14",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pyyaml>=6.0.2",
  "typer>=0.13",
  "itsdangerous>=2.2",
  "defusedxml>=0.7.1",
  "dnspython>=2.7",
  "python-multipart>=0.0.17",
  "apprise>=1.9",
  "aiomqtt>=2.3",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML",
  "asyncpg>=0.30",
]

[project.scripts]
pulse = "pulse.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pulse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "B008", "RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501"]
"pulse/db/migrations/versions/**" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["live: needs real network access (skipped by default)"]
addopts = "-m 'not live'"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pulse.verdict.*", "pulse.adapters.*", "pulse.probes.*"]
disallow_untyped_defs = true
